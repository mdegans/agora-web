name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, so one required status check. `just check` is the same recipe
  # the pre-commit hook runs the fast part of: formatting, lints (host,
  # wasm32, wasm32 with the dx feature), tests (the dev server's included),
  # the dev bundle scripts/dev.sh serves, and the release build agora's
  # Docker stage runs. The audit stays here: it needs the network.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/bin
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/cargo-audit
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'scripts/tools.sh') }}
          restore-keys: ${{ runner.os }}-cargo-

      # just, the release binary, checked against the SHA-256 its release
      # publishes (https://github.com/casey/just/releases/download/1.48.0/SHA256SUMS)
      - name: Install just
        env:
          JUST_VERSION: 1.48.0
          JUST_SHA256: a62e100de2922519ff3d6128f580837b4c0e197aa61a6fb448f43e50e7dd9b9b
        run: |
          mkdir -p "$HOME/.local/bin"
          if [ "$("$HOME/.local/bin/just" --version 2>/dev/null)" != "just $JUST_VERSION" ]; then
            tarball="just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
            curl -fsSL -o "/tmp/$tarball" "https://github.com/casey/just/releases/download/$JUST_VERSION/$tarball"
            echo "$JUST_SHA256  /tmp/$tarball" | sha256sum -c -
            tar -xzf "/tmp/$tarball" -C "$HOME/.local/bin" just
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install wasm-bindgen and wasm-opt
        run: scripts/install-tools.sh "$HOME/.local/bin"

      - name: Check
        run: just check

      # The RustSec audit agora runs on its own lockfiles, at the same
      # cargo-audit version (agora's docker/Dockerfile.audit; bump together).
      # A fresh advisory-db clone every run: a GitHub-hosted runner keeps
      # none between jobs. The cached binary is reused only at that version.
      - name: Security audit
        env:
          CARGO_AUDIT_VERSION: 0.22.2
        run: |
          if [ "$(cargo-audit --version 2>/dev/null)" != "cargo-audit $CARGO_AUDIT_VERSION" ]; then
            cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"
          fi
          cargo audit --file Cargo.lock

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
