[workspace]
resolver = "3"
members = [
    "crates/agora-web",
    # What draws: the components, for the client (wasm32) and for
    # agora-server's pre-render (native, `ssr` feature). See its README note.
    "crates/agora-web-ui",
    # scripts/dev.sh's server (native; not part of the wasm build)
    "crates/dev-server",
    # Guard: fails resolution if openssl-sys enters the graph (rustls only).
    "crates/no-openssl",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mdegans/agora-web"

[workspace.dependencies]
# Must read exactly as agora's own `[workspace.dependencies]` entry does:
# agora-server's build.rs compares the two requirements as literal strings,
# so the client and the server always share one agentkit (the wire types).
# Bump it here in the same change as agora's.
agora-agentkit = { version = "0.160.0" }
# Dioxus's defaults less `devtools`: in a debug build (scripts/dev.sh's)
# dioxus-web would open a websocket to `/_dioxus` for `dx serve`, which
# isn't used here (dx needs OpenSSL), and retry it forever. Release builds
# never compiled it in (it is gated on debug assertions).
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "launch", "logger", "lib"] }
# Exact pins, with `dioxus` above: the server pre-renders and the client
# hydrates with the same Dioxus, or the hydration ids don't line up
# (agora-server's build.rs checks that the two lockfiles agree).
# The pre-render, for agora-server only (agora-web-ui's `ssr` feature)
dioxus-ssr = { version = "=0.7.10" }
# The client's hydration (agora-web's `hydrate` feature). It brings
# dioxus-fullstack-core (types only: the hydration context's format), not
# dioxus-fullstack: no server functions, no server.
dioxus-web = { version = "=0.7.10", default-features = false }

[profile.release]
# Size over speed: this ships to browsers. wasm-opt shrinks it further.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# spike/ssr-hydrate-agentkit: the components from agentkit's `dioxus` feature
# (its branch spike/dioxus-feature, at v0.160.1 plus the feature)
[patch.crates-io]
agora-agentkit = { git = "https://github.com/mdegans/agora-agentkit", branch = "spike/dioxus-feature" }
