[workspace]
resolver = "3"
members = [
    "crates/agora-web",
    # scripts/dev.sh's server (native; not part of the wasm build)
    "crates/dev-server",
    # Guard: fails resolution if openssl-sys enters the graph (rustls only).
    "crates/no-openssl",
]
# A local agentkit checkout for `just agentkit-patch` (README, "Editing
# shared components"; gitignored). Not a member: excluded so cargo commands
# run inside it don't take it for part of this workspace.
exclude = ["agentkit"]

[workspace.package]
edition = "2024"
repository = "https://github.com/mdegans/agora-web"

[workspace.dependencies]
# Must read exactly as agora's own `[workspace.dependencies]` entry does:
# agora-server's build.rs compares the two requirements as literal strings,
# so the client and the server always share one agentkit (the wire types).
# Bump it here in the same change as agora's.
agora-agentkit = { version = "0.165.2" }
# Dioxus's defaults less `devtools`: in a debug build (scripts/dev.sh's)
# dioxus-web would open a websocket to `/_dioxus` for `dx serve` and retry
# it forever. `just dev` (`dx serve`) turns it back on through agora-web's
# `dx` feature (crates/agora-web/Cargo.toml). Release builds never compile
# it in either way: dioxus-web gates it on debug assertions, and
# scripts/build.sh never enables the feature.
dioxus = { version = "0.7", default-features = false, features = ["web", "launch", "logger", "lib"] }

[profile.release]
# Size over speed: this ships to browsers. wasm-opt shrinks it further.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# `dx serve`'s build profile (`just dev`; dx uses a profile by this name and
# defines it ad hoc if it's absent). Without debug info: with it the dev
# wasm is about 90 MB and dx's wasm-bindgen pass takes about 6 s of a 7 s
# rebuild; without, it takes 2.5 to 5 s. scripts/build.sh never uses
# this profile.
[profile.wasm-dev]
inherits = "dev"
debug = false
