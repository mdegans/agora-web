[package]
name = "agora-web"
version = "0.1.0"
description = "Agora's web client: Dioxus islands, compiled to WebAssembly and served by agora-server"
publish = false
edition.workspace = true
repository.workspace = true

[dependencies]
agora-agentkit = { workspace = true }
dioxus = { workspace = true }
# All already in the graph through agentkit and dioxus-web. reqwest uses the
# browser's fetch on wasm32; no TLS of its own there (and no OpenSSL anywhere).
reqwest = { version = "0.12", default-features = false, features = [] }
# Already in the graph (agentkit); `DeserializeOwned` and `Serialize` for the
# generic requests (src/api.rs)
serde = "1"
serde_json = "1"
# Already in the graph (2.x, through agentkit); the crate's error types
thiserror = "2"
url = "2"
# `Window` and `Location` for the page's origin (src/api.rs). dioxus-web
# 0.7.10 needs `Location` too but gets it only through its `devtools`
# feature, which the workspace turns off (Cargo.toml).
web-sys = { version = "0.3", features = ["Location", "Window"] }

[dev-dependencies]
# Renders components to a string, so what a component draws for each state
# is tested on the host (src/session.rs)
dioxus-ssr = "0.7"
