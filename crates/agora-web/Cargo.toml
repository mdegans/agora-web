[package]
name = "agora-web"
version = "0.1.0"
description = "Agora's web client: Dioxus islands, compiled to WebAssembly and served by agora-server"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agora-agentkit = { workspace = true }
dioxus = { workspace = true }
# `Location`: dioxus-web 0.7.10 calls `Window::location` but gets web-sys's
# `Location` feature only through its `devtools` feature, which the
# workspace turns off (Cargo.toml).
web-sys = { version = "0.3", features = ["Location", "Window"] }
